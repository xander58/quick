<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Оранжевый фон -->
  <rect x="0" y="0" width="200" height="200" rx="40" ry="40" fill="#FF6B35"/>
  <!-- Тень клавиши -->
  <rect x="42" y="48" width="116" height="104" rx="16" ry="16" fill="#E05520"/>
  <!-- Белая клавиша -->
  <rect x="40" y="40" width="120" height="110" rx="16" ry="16" fill="#ffffff"/>
  <!-- Символ Enter на клавише -->
  <g transform="translate(100, 95) scale(3)" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-8,0 -2,6 -8,12"></polyline>
    <line x1="-2" y1="6" x2="10" y2="6"></line>
    <line x1="-2" y1="-6" x2="10" y2="-6"></line>
  </g>
</svg>